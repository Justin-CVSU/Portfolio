<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Byter's Almanac</title>
<link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?
family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css" integrity="sha512-10/jx2EXwxxWqCLX/hHth/vu2KY3jCF70dCQB8TSgNjbCVAC/8vai53GfMDr02Emgwccf2pJqxct9ehpzG+MTw==" crossorigin="anonymous" referrerpolicy="
no-referrer" />

</head>
<style>
*{
	padding: 0;
	margin: 0;
	box-sizing: border-box;
	font-family: 'Popppins', sans-serif;
	text-decoration: none; 
	text-shadow: 5px 5px 5px black;
}
body{
	overflow-x: hidden;
}
.slider{
	background:url(adobo1.jpg);
	background-size: cover;
	background-position: center;
	animation: slide 20s infinite;
}
@keyframes slide{
	25%{
	background:url(ramen1.jpg);
	background-size: cover;
	background-position: center;
	}
	50%{
	background:url(tortilla1.jpg);
	background-size: cover;
	background-position: center;
	}
	75%{
	background:url(kimchi1.jpg);
	background-size: cover;
	background-position: center;
	}
	100%{
	background:url(omurice1.jpg);
	background-size: cover;
	background-position: center;
	}
}
.main-width{
	width: 1280px;	
	max-width: 95%;
	margin: 0 auto;
	padding: 0px 20px;
}
.hero{
	width: 100%;
	height: 100%;
	min-height: 100vh;
	background-size: cover;
	background-position: center;
	position: relative;
}
header{
	padding: 40px 0 30px;
	display: flex;
	flex-wrap: nowrap;
	align-items: center;
	justify-content: space-between;
}

nav .hamb{
	width: 35px;
	height: 24px;
	right: 3%;
	top: 60px;
	z-index: 5;
	background: transparent;
	position: absolute;
	cursor: pointer;
	display: none;
}
nav .hamb span{
	display: block;
	background: #2ecc71;
	width: 100%;
	height: 3px;
	transition: .3s;
	transition-property: transform,opacity;
}
nav .hamb span:nth-child(2){
	margin: 7px 0px;
}
nav .nav-list{
	list-style: none;
}
nav .nav-list li{
	display: inline-block;
}
nav .nav-list li a{
	display: inline-block;
	color: #eee;
	margin-left: 55px;
	font-size: 15px;
	font-weight: 600;
}
nav .nav-list li:not(:last-child) a:hover{
	color: #2ecc71;
	transition: .4s;
}
nav .nav-list li.btn a{
	display: inline-block;
	background: transparent;
	border: 2px solid #2ecc71;
	padding: 9px 28px;
	border-radius: 30px;
	line-height: 1.3;
	color: #2ecc71;
	font-weight: 500;
}
nav .nav-list li.btn:hover a{
	background: #2ecc71;
	color: white;
	border: 2px solid transparent;
	transition: .4s;
}
.container{
	padding-top: 190px;
}
.container .hero-text{
	padding-top: 40px;
}
.container .hero-text h1{
	color: white;
	font-size: 47px;
	font-weight: 900;
	line-height: 1.2;
	margin: 20px 0px 20px;
}
span{
	color: #2ecc71;
}
.container .hero-text h3{
	color: #eee;
	font-weight: 1000;
	font-size: 75px;
}
.container .hero-text p{
	width: 440px;
	max-width:100%;
	color: #eee;
	font-size: 15px;
	margin-bottom: 30px;
}
.social a{
	width: 37px;
	height: 37px;
	border-radius: 50%;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	font-size: 17px;
	color: #eee;
	cursor: pointer;
	margin-right: 20px;
	background-color: rgba(255, 255, 255, 0.1);
	margin-bottom: 35px;
}
.social a:hover{
	transform: scale(1.1);
	background: #2ecc71;
	transition: .4s;
}
.container .hero-text button{
	color: #eee;
	background: #2ecc71;
	font-size: 16px;
	font-weight: 500;
	line-height: 24px;
	padding: 8px 30px;
	border: 2px solid #2ecc71;
	border-radius: 30px;
	cursor: pointer;
}
.container .hero-text button:hover{
	background: transparent; 
	border: 2px solid #2ecc71;
	color: #2ecc71;
	transition: .4s;
}
.bottom{
	margin-top: 243px;
	padding-bottom: 40px
}
.bottom p{
	color: #eee;
	letter-spacing: 2px;
	font-size: 15px;
}
.bottom p{
	color: #eee;
	Letter-spacing: 2px;
	font-size: 15px;
}

@media screen and (max-width: 930px) {
	nav .hamb{
		display: initial;
	}
	.click{
		top: 46px;
	}
	.click span{
		position:absolute;
		margin-top: 12px;
	}
	.click span:first-child{
		transform: rotate(-40deg);
	}
	.click span:nth-child(2){
		opacity: 0;
		margin: 0;
	}
	.click span:last-child{
		transform: rotate(40deg);
		top: 0;
	}
	nav .nav-list{
		position: absolute;
		top: 90px;
		right: -65%;
		bottom: 0;
		width: 60%;
		height: 50%;
		background: black;
		z-index: 2;
		padding: 6% 9%;
		transition: .3s right;
		border-radius: 10px;
	}
	nav .nav-list li{
		display: block;
	}	
	nav .nav-list a{
		display: block;
		text-align: center;
		font-size: 18px;
		font-weight: 400;
		margin-left: 0;
		margin-bottom: 40px;
	}
	nav .nav-list li.btn a{
		position: absolute;
		bottom: 0%;
		right: 20%;
		Left: 20%;
		padding: 7px 15px;
		font-size: 14px;
	}
	nav .nav-list.open{
		right: 0;
	}
}
</style>
<body>
<div class="slider">
<section class= "hero">
	<div class="main-width">
	<header>
		<div class="logo">
		<img src="logon.png" width="100px">
		</div>

		<nav>
			<div class="hamb">
				<span></span>
				<span></span>
				<span></span>
			</div>

			<ul class="nav-list">
				<li><a href="about.html"><b>About us</b></a></li>
				<li class="btn"><a href="download.html"><b>Download Full Version</b></a></li>
			</ul>
		</nav>
	</header>

	<div class="container">
		<div class="hero-text">
			<h3>Byter's Almanac</h3>
			<h1>Learn <span class="input">to cook.</span></h1>
			<p>A Learning and Recipe guide for cooking Indigeneous Foods.</p>
			<div class="social">
		</div>	
			<a href="getstart.html"><button type="button"><b>Start Free Demo</b></button></a>
		</div>
		<div class="bottom">
			<p>credits: 2023 BSIT1-3 MARANAN, ESCARIAL, GLORY, EBRAHIM, NAVARRO - All Rights Reserved.</p>
		</div>
		</div>
	</div>
</div>
	</section>

	<script type="text/javascript" src="js/script.js"></script>
	<script src = "https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
	<script>
		var typed = new Typed(".input" , {
		strings: ["to bake. ","to fry.", "to grill."], 
			typeSpeed: 50,
			backSpeed: 150,
			loop:true
		});
	</script>
	<script>
	var hamburger = document.querySelector(".hamb");
	var navlist = document.querySelector(".nav-list");
	var links = document.querySelector(".nav-list li");

	hamburger.addEventListener("click", function(){
		this.classList.toggle("click");
		navlist.classList.toggle("open");
	});
	</script>
</body>
</html>
